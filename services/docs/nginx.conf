server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Compression ---------------------------------------------------
    # Skip images/fonts, they're already compressed; gzip only text.
    # (text/html is always gzipped when gzip is on.)
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- Health check for Coolify --------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- Build stamp: never cache --------------------------------------
    # /version.txt answers "what is actually deployed right now". A cached
    # copy would answer the opposite question and answer it wrongly, so this
    # is explicit rather than relying on the catch-all below.
    location = /version.txt {
        add_header Cache-Control "no-store";
        add_header Content-Type text/plain;
    }

    # --- Hashed build output: cache hard -------------------------------
    # Astro content-hashes everything under /_astro/, so a changed file gets a
    # new name. These can never go stale, which is what immutable is for.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Fonts: stable names, so a shorter window ----------------------
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Pagefind index: revalidate ------------------------------------
    # The search index filenames are NOT content-hashed and they change on
    # every build. Caching these would serve yesterday's search results
    # against today's pages.
    location /pagefind/ {
        add_header Cache-Control "no-cache";
    }

    # --- HTML: always revalidate so edits go live on the next load -----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
